<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>巷伴 動態標準字</title>
<style>
  :root{ --ink:#634F44; --bg:#FFFFFF; --lampIn:#FFF1D2; --lampOut:#F2CB86; }
  body.dark{ --ink:#FFFFFF; --bg:#000000; --lampIn:#FFE7B0; --lampOut:#F0B04F; }
  html,body{margin:0;height:100%;background:var(--bg);transition:background .5s;font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif}
  .stage{height:100%;display:flex;align-items:center;justify-content:center}
  svg{width:min(88vw,1000px);height:auto}
  .ink{fill:var(--ink);transition:fill .5s}
  .m{fill:#fff;transform-box:view-box}

  /* 緩動：快速出現、慢慢收尾，不回彈 */
  :root{--out:cubic-bezier(.16,1,.3,1); --io:cubic-bezier(.65,0,.35,1)}

  /* 1 艹：由左往右顯影 */
  #mTop{transform-origin:90px 0;animation:sx .9s var(--io) 0s both}
  /* 2 半＋點：由上往下 */
  #mBan{transform-origin:0 730px;animation:sy 1s var(--io) .25s both}
  .dot{animation:drop .8s var(--out) both}
  #d1{animation-delay:.45s} #d2{animation-delay:.55s}
  /* 3 屋簷與巳：從屋頂往外展開（最後才到右手） */
  #mRoof{transform-origin:372px 985px;animation:grow 1.25s var(--io) .45s both}
  /* 4 人字撇：由右上往下長到手（與右手同時抵達 = 牽手） */
  #mRen{transform-origin:893px 752px;animation:grow 1.05s var(--io) .65s both}
  /* 5 拐杖：落下、著地輕晃後靜止 */
  #mCane{transform-origin:0 985px;animation:sy .55s var(--out) 1.55s both}
  #cane{transform-box:view-box;transform-origin:793px 993px;animation:settle 1.4s linear 1.85s both}
  /* 6 窗：暖機式亮燈，之後極緩的呼吸 */
  #lamp{opacity:0;animation:warm 1.2s var(--out) 2.4s forwards, idle 7s ease-in-out 4.2s infinite}

  @keyframes sx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes sy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
  @keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
  @keyframes settle{0%{transform:rotate(0)}12%{transform:rotate(2.4deg)}34%{transform:rotate(-1.2deg)}56%{transform:rotate(.5deg)}78%{transform:rotate(-.15deg)}100%{transform:rotate(0)}}
  @keyframes warm{0%{opacity:0}35%{opacity:.55}50%{opacity:.48}100%{opacity:1}}
  @keyframes idle{0%,100%{opacity:1}50%{opacity:.82}}

  .ui{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:10px}
  .ui button{border:1px solid currentColor;background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font-size:13px;letter-spacing:.05em;cursor:pointer;opacity:.6}
  .ui button:hover{opacity:1}
  body.capture .ui{display:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
